<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="script.js" defer></script>
    <title>Task 3</title>
</head>
<body>
    <div class="w-[400px] mx-auto mt-32 border rounded-lg p-6">
        <h1 class="text-2xl font-bold mb-2 text-center">Заказ билетов</h1>
        <p class="text-gray-500 mb-4 text-center">Pick your event and let's go!</p>
        <form id="form" class="flex flex-col gap-3" novalidate>
            <input id="name" type="text" placeholder="Write ur name" class="border rounded p-2">
            <input id="email" type="email" placeholder="Your email" class="border rounded p-2">
            <select id="list" class="border rounded p-2">
                <option value="">Выберите мероприятие</option>
            </select>
            <input id="count" type="number" min="1" max="10" placeholder="Количество билетов (1-10)" class="border rounded p-2">
            <button type="submit" class="border rounded p-2 cursor-pointer">Рассчитать стоимость</button>
        </form>
        <p id="result" class="mt-4 whitespace-pre-line"></p>
    </div>
</body>
</html>
